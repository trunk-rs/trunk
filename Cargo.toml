[package]
name = "trunk"
version = "0.22.0-rc.1"
edition = "2024"
description = "Build, bundle & ship your Rust WASM application to the web."
license = "MIT/Apache-2.0"
authors = [
    "Anthony Dodd <dodd.anthonyjosiah@gmail.com>",
    "Jens Reimann <ctron@dentrassi.de>",
]
repository = "https://github.com/trunk-rs/trunk"
readme = "README.md"
categories = ["command-line-utilities", "wasm", "web-programming"]
keywords = ["wasm", "bundler", "web", "build-tool", "compiler"]
rust-version = "1.96.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1"
async-compression = { version = "0.4.41", features = ["gzip", "tokio"] }
async-tar = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = "0.8"
backon = "1"
base64 = "0.23"
bytes = "1"
cargo-lock = "11"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
console = "0.16.2"
directories = "6"
dunce = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
globset = "0.4"
hickory-resolver = { version = "0.26", features = ["system-config"] }
htmlescape = "0.3.1"
http = "1.4"
humantime = "2"
humantime-serde = "1"
local-ip-address = "0.6"
lol_html = "2"
mime_guess = "2"
minify-html = "0.18"
notify = "8"
notify-debouncer-full = "0.7"
open = "5"
oxipng = "10"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "hickory-dns", "json", "socks"] }
native-tls-provider = { package = "native-tls", version = "0.2", default-features = false, features = ["alpn-accept"], optional = true }
rustls-provider = { package = "rustls", version = "0.23", default-features = false, optional = true }
schemars = { version = "1", features = ["derive"] }
seahash = { version = "4", features = ["use_std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.33" # serde-yaml is deprecated, but "just works", let's see who becomes the next serde_yaml
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
swc_common = { version = "24", features = ["sourcemap"] }
swc_ecma_ast = "26"
swc_ecma_codegen = "29"
swc_ecma_minifier = "58"
swc_ecma_parser = "42"
swc_ecma_transforms_base = "46"
swc_ecma_visit = "26"
tar = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", default-features = false, features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = ["fs", "sync"] }
tokio-native-tls = { version = "0.3", optional = true }
tokio-tungstenite = "0.30"
tokio-util = "0.7.18"
toml = "1"
tower-http = { version = "0.7", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
which = "8"
zip = "8"

# pin lightningcss, used by trunk, also pulled in by minify-html
lightningcss = "=1.0.0-alpha.72"

[target.'cfg(windows)'.dependencies]
nu-ansi-term = "0.50"

[dev-dependencies]
tempfile = "3"
rstest = "0.26.1"

[features]
default = ["update_check", "rustls"]

# use rustls as TLS stack
rustls = [
    "dep:rustls-provider",
    "rustls-provider/ring",
    "axum-server/tls-rustls-no-provider",
    "reqwest/rustls-no-provider",
    "tokio-tungstenite/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
]

rustls-aws-lc = [
    "dep:rustls-provider",
    "rustls-provider/aws-lc-rs",
    "axum-server/tls-rustls-no-provider",
    "reqwest/rustls-no-provider",
    "tokio-tungstenite/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
]

# use the platform-native TLS stack for clients and the server
native-tls = [
    "dep:native-tls-provider",
    "dep:tokio-native-tls",
    "reqwest/native-tls",
    "tokio-tungstenite/native-tls",
]

# enable the update check on startup
update_check = []

# enable vendoring on crates supporting that
vendored = ["native-tls-provider?/vendored"]

[package.metadata.cargo-all-features]
skip_optional_dependencies = true
denylist = ["default", "native-tls", "rustls", "rustls-aws-lc"]
